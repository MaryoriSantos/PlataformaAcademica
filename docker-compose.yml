services:
  # Base de datos MySQL del proyecto
  mysql:
    image: mysql:8.0
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: plataforma_academica
      MYSQL_USER: ${MYSQL_USER:-plataforma_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in .env}

    # Puerto 3307 de tu computador -> puerto 3306 de MySQL
    ports:
      - "3307:3306"

    # Conserva los datos y permite importar el SQL al inicializar MySQL
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/plataforma_academica.sql:/docker-entrypoint-initdb.d/01-plataforma_academica.sql:ro

    # Comprueba que el servidor MySQL este disponible
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Backend Spring Boot y frontend
  backend:
    image: dobongi/backend-spring:latest
    restart: unless-stopped

    # Puerto 8090 de tu computador -> puerto 8080 del contenedor
    ports:
      - "8090:8080"

    # Configuracion de conexion a MySQL y clave JWT
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/plataforma_academica?serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-plataforma_app}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in .env}

    # Inicia el backend cuando MySQL este disponible
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: