name: CI PlataformaAcademica

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      # Descarga el codigo del repositorio
      - name: Descargar codigo
        uses: actions/checkout@v4

      # Configura Java 21 y Maven
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compila el proyecto y genera el archivo JAR
      - name: Compilar backend
        run: mvn -B -DskipTests clean package

      # Construye la imagen Docker del backend
      - name: Construir imagen Docker
        run: docker build -t plataformaacademica-backend:ci .