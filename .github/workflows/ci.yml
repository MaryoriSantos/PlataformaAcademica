
name: CI PlataformaAcademica

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      # Descarga el codigo del repositorio
      - name: Descargar codigo
        uses: actions/checkout@v7

      # Configura Java 21 y Maven
      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compila el proyecto con Maven
      - name: Compilar backend
        run: mvn -B -DskipTests clean package

      # Inicia sesion en Docker Hub solo al subir cambios a main
      - name: Iniciar sesion en Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Prepara la construccion de imagenes Docker
      - name: Configurar Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v4

      # Construye la imagen y la publica en Docker Hub
      - name: Construir y publicar imagen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: dobongi/backend-spring:latest
